name: air_reply
description: "AirReply: mirror notifications from one phone to a paired device and reply to messages from it."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # state, dependency injection and navigation
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.1
  # backend: anonymous auth, the paired-device documents, and push to wake the other device
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  cloud_firestore: ^7.1.0
  firebase_messaging: ^17.0.1
  # pairing: QR code shown by the sender, scanned by the receiver
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.2
  # end-to-end encryption: X25519 key agreement, HKDF, AES-256-GCM, and the key kept in Keystore / Keychain
  cryptography: ^2.9.0
  flutter_secure_storage: ^11.2.0
  # mirrored alerts (with an inline reply action) on the receiver
  flutter_local_notifications: ^22.3.2
  shared_preferences: ^2.5.6
  device_info_plus: ^13.3.0
  http: ^1.6.0
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  # localization: Material's own strings in every language, and gen-l10n's AppLocalizations (lib/l10n)
  flutter_localizations:
    sdk: flutter
  intl: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # In-memory SharedPreferencesAsync for store tests (already a transitive dependency of shared_preferences).
  shared_preferences_platform_interface: ^2.4.2
  flutter_launcher_icons: ^0.14.4
  drift_dev: ^2.35.2
  build_runner: ^2.15.1

flutter:
  uses-material-design: true
  # localized strings: lib/l10n/*.arb → AppLocalizations (see l10n.yaml)
  generate: true

  assets:
    # Open Font License text, shown on the Licenses page (see bootstrap.dart).
    - assets/fonts/OFL-Geist.txt
    # MIT licence of the Phosphor icons, likewise
    - assets/fonts/MIT-Phosphor.txt

  # Geist for the interface and Geist Mono for the small green labels, as in the iFixxer app. Bundled so text never
  # shifts while fonts download, and the app looks the same offline.
  fonts:
    - family: Geist
      fonts:
        - asset: assets/fonts/Geist.ttf
    # Phosphor icons (MIT, assets/fonts/MIT-Phosphor.txt), used through AppIcons
    - family: PhosphorRegular
      fonts:
        - asset: assets/fonts/Phosphor.ttf
    - family: PhosphorFill
      fonts:
        - asset: assets/fonts/Phosphor-Fill.ttf
    - family: GeistMono
      fonts:
        - asset: assets/fonts/GeistMono.ttf

hooks:
  user_defines:
    # sqlite3 comes with drift_flutter; this picks its build:
    sqlite3:
      # SQLite3MultipleCiphers instead of plain SQLite on Android, iOS, macOS, Windows and Linux: the history database,
      # its search index included, is encrypted at rest with a key kept in the system keystore (HistoryKey).
      source: sqlite3mc
