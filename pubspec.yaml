name: air_reply
description: "AirReply: mirror notifications from one phone to a paired device and reply to messages from it."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  # state, dependency injection and navigation
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.1
  # backend: anonymous auth, the paired-device documents, and push to wake the other device
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  cloud_firestore: ^7.1.0
  firebase_messaging: ^17.0.1
  # pairing: QR code shown by the sender, scanned by the receiver
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.2
  # end-to-end encryption: X25519 key agreement, HKDF, AES-256-GCM, and the key kept in Keystore / Keychain
  cryptography: ^2.9.0
  flutter_secure_storage: ^11.2.0
  # mirrored alerts (with an inline reply action) on the receiver
  flutter_local_notifications: ^22.3.2
  shared_preferences: ^2.5.6
  device_info_plus: ^13.3.0
  http: ^1.6.0
  change_app_package_name: ^1.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
  # In-memory SharedPreferencesAsync for store tests (already a transitive dependency of shared_preferences).
  shared_preferences_platform_interface: ^2.4.2

flutter:
  uses-material-design: true

  assets:
    # Open Font License texts, shown on the Licenses page (see bootstrap.dart).
    - assets/fonts/OFL-DMSans.txt
    - assets/fonts/OFL-InstrumentSerif.txt

  # Editorial type: Instrument Serif for headlines, DM Sans for the interface. Bundled so text never shifts while
  # fonts download, and the app looks the same offline.
  fonts:
    - family: InstrumentSerif
      fonts:
        - asset: assets/fonts/InstrumentSerif-Regular.ttf
        - asset: assets/fonts/InstrumentSerif-Italic.ttf
          style: italic
    - family: DMSans
      fonts:
        - asset: assets/fonts/DMSans-Regular.ttf
        - asset: assets/fonts/DMSans-Italic.ttf
          style: italic
        - asset: assets/fonts/DMSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/DMSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/DMSans-Bold.ttf
          weight: 700
